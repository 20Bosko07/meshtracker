# Additional file for a companion connected by USB (serial). Usage:
#
#   docker compose -f docker-compose.yml -f docker-compose.serial.yml up -d --build
#
# In .env:  MT_TRANSPORT=serial  and  MT_SERIAL_PORT=/dev/ttyACM0 (adjust to your device)
services:
  meshtracker:
    devices:
      - "${MT_SERIAL_PORT:-/dev/ttyACM0}:${MT_SERIAL_PORT:-/dev/ttyACM0}"
    group_add:
      - dialout
