# Zusatzdatei für Companion per USB (Serial). Aufruf:
#
#   docker compose -f docker-compose.yml -f docker-compose.serial.yml up -d --build
#
# In .env:  MT_TRANSPORT=serial  und  MT_SERIAL_PORT=/dev/ttyACM0 (je nach Gerät anpassen)
services:
  meshtracker:
    devices:
      - "${MT_SERIAL_PORT:-/dev/ttyACM0}:${MT_SERIAL_PORT:-/dev/ttyACM0}"
    group_add:
      - dialout
