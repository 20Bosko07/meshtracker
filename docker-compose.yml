# MeshTracker – Docker Compose
#
# Settings come from the file ".env" (template: .env.example) or from the environment.
# You normally do not need to edit this file.
#
#   cp .env.example .env && nano .env
#   docker compose up -d --build
services:
  meshtracker:
    build: .
    image: meshtracker:latest
    container_name: meshtracker
    restart: unless-stopped
    ports:
      - "${MT_WEB_PORT:-8282}:8000"
    volumes:
      - meshtracker-data:/data
    environment:
      # Connection to the MeshCore companion
      MT_TRANSPORT: ${MT_TRANSPORT:-tcp}
      MT_HOST: ${MT_HOST:-192.168.1.50}
      MT_PORT: ${MT_PORT:-5000}
      MT_SERIAL_PORT: ${MT_SERIAL_PORT:-/dev/ttyACM0}
      MT_SERIAL_BAUD: ${MT_SERIAL_BAUD:-115200}
      # Optional password protection of the web interface (set both)
      MT_AUTH_USER: ${MT_AUTH_USER:-}
      MT_AUTH_PASSWORD: ${MT_AUTH_PASSWORD:-}
      # Map
      MT_TILE_URL: ${MT_TILE_URL:-}
      MT_TILE_ATTRIBUTION: ${MT_TILE_ATTRIBUTION:-}
      MT_TILE_MAX_ZOOM: ${MT_TILE_MAX_ZOOM:-}
      # Fine tuning (empty = default value)
      MT_FLOOD_RETRIES: ${MT_FLOOD_RETRIES:-}
      MT_PATH_TIMEOUT: ${MT_PATH_TIMEOUT:-}
      MT_FLOOD_TIMEOUT: ${MT_FLOOD_TIMEOUT:-}
      MT_FLOOD_BACKOFF: ${MT_FLOOD_BACKOFF:-}
      MT_MIN_SPACING: ${MT_MIN_SPACING:-}
      MT_FAIL_RETRY: ${MT_FAIL_RETRY:-}
      MT_LOG_LEVEL: ${MT_LOG_LEVEL:-INFO}

volumes:
  meshtracker-data:
