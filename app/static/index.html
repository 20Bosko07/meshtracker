<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MeshTracker</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>MeshTracker</h1>
    <span id="link-badge" class="badge off" title="">Connecting …</span>
    <span class="spacer"></span>
    <label class="range">Time range:
      <select id="range">
        <option value="3600">1 hour</option>
        <option value="21600">6 hours</option>
        <option value="86400" selected>24 hours</option>
        <option value="604800">7 days</option>
        <option value="0">All</option>
      </select>
    </label>
  </header>

  <main>
    <aside>
      <div id="trackers"></div>
      <button id="add-btn" class="primary">+ Add tracker</button>
      <p id="empty-hint" class="hint" hidden>
        No tracker yet. Click “Add tracker” and enter the public key of your tracker
        or pick it from your node's contacts.
      </p>
    </aside>
    <div class="stage">
      <div id="map"></div>
      <section id="charts" class="charts" hidden>
        <div class="charts-head">
          <h2>History</h2>
          <select id="chart-tracker" aria-label="Tracker for the history" hidden></select>
          <span class="spacer"></span>
          <button id="chart-view" type="button">Table</button>
          <button id="chart-toggle" type="button" aria-expanded="true" title="Collapse / expand">▾</button>
        </div>
        <div id="chart-body">
          <div id="chart-grid" class="chart-grid"></div>
          <div id="chart-table" class="table-wrap" hidden></div>
          <p id="chart-empty" class="hint chart-empty" hidden></p>
        </div>
      </section>
    </div>
  </main>

  <dialog id="dlg">
    <form method="dialog" id="form">
      <h2 id="dlg-title">Tracker</h2>
      <label id="pick-row">Pick a contact from the node
        <select id="f-pick"><option value="">– enter manually –</option></select>
      </label>
      <label>Name <input id="f-name" maxlength="40" required></label>
      <label id="key-row">Public key (64 hex characters)
        <input id="f-key" maxlength="64" pattern="[0-9a-fA-F]{64}" spellcheck="false" required>
      </label>
      <label>Poll interval (minutes)
        <input id="f-interval" type="number" min="1" max="1440" value="10" required>
      </label>
      <label>Routing
        <select id="f-mode">
          <option value="auto">Auto: stored path, flood immediately on failure</option>
          <option value="flood">Always flood (most reliable for moving trackers)</option>
        </select>
      </label>
      <label class="inline" id="enabled-row"><input id="f-enabled" type="checkbox" checked> Polling enabled</label>
      <p id="form-error" class="error" hidden></p>
      <menu>
        <button type="button" id="cancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </menu>
    </form>
  </dialog>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
